<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>GitHub Reskin, site film</title>
    <script src="assets/vendor/gsap-3.15.0.min.js"></script>
    <style>
      /* GitHub Reskin site film, 1920x1080, 30 fps, 900 frames. It plays muted by default, so every
         claim is on screen. Title-safe x=192..1728, y=108..972; y=880..972 stays free for the
         player's optional captions. The anime title is the 84 px headline, the theme name 40 px
         beneath it. Real extension captures at the D size (1440x1000 CSS px, DPR 2). */
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/Manrope-Variable.ttf") format("truetype");
        font-weight: 200 800;
        font-style: normal;
      }
      :root {
        --canvas: #0c0f14;
        --ivory: #f5f3ee;
        --muted: #b0b8c5;
        --coral: #ff806c;
        --charcoal: #151a22;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--canvas);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--canvas);
        font-family: "Manrope", sans-serif;
        color: var(--ivory);
      }
      /* Blurred derivatives of the captures (assets/backdrops/make.mjs). */
      .backdrop {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .backdrop img {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        opacity: 0.75;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(12, 15, 20, 0.82) 0%, rgba(12, 15, 20, 0.6) 28%, rgba(12, 15, 20, 0.35) 60%, rgba(12, 15, 20, 0.6) 100%);
      }
      .head {
        position: absolute;
        left: 192px;
        top: 100px;
        width: 1536px;
        height: 190px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .eyebrow {
        font-size: 36px;
        font-weight: 600;
        color: var(--muted);
        line-height: 1.2;
        margin-bottom: 4px;
      }
      .title {
        font-size: 84px;
        font-weight: 650;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }
      .theme {
        font-size: 40px;
        font-weight: 600;
        color: var(--coral);
        line-height: 1.2;
        margin-top: 4px;
      }
      .note {
        font-size: 34px;
        font-weight: 600;
        color: var(--muted);
        line-height: 1.2;
        margin-top: 6px;
      }
      /* Product window, x=192..1728, y=306..872. A page image is placed by --k (output px per CSS
         px), --x0 and --y0 (the crop's top-left in CSS px); the default shows the full 1440 width. */
      .shot {
        position: absolute;
        left: 192px;
        top: 306px;
        width: 1536px;
        height: 566px;
        border-radius: 20px;
        overflow: hidden;
        background: var(--charcoal);
        box-shadow: 0 0 0 2px rgba(245, 243, 238, 0.14), 0 30px 80px rgba(0, 0, 0, 0.55);
      }
      .layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
        --k: 1.0667px;
        --x0: 0;
        --y0: 0;
      }
      .page {
        position: absolute;
        left: calc(var(--x0) * -1 * var(--k));
        top: calc(var(--y0) * -1 * var(--k));
        width: calc(1440 * var(--k));
      }
      .src {
        position: absolute;
        right: 192px;
        top: 112px;
        font-size: 28px;
        font-weight: 600;
        color: var(--muted);
        text-align: right;
      }
      .src span {
        display: inline-block;
        padding: 4px 14px;
        border-radius: 10px;
        background: rgba(12, 15, 20, 0.78);
      }
      .src b {
        color: var(--ivory);
        font-weight: 650;
      }
      .edge {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 6px;
        background: var(--ivory);
        opacity: 0;
      }
      .popup {
        position: absolute;
        overflow: hidden;
        border-radius: 14px;
        box-shadow: 0 0 0 2px rgba(245, 243, 238, 0.22), 0 24px 60px rgba(0, 0, 0, 0.6);
        background: #0d1117;
      }
      .popup img {
        position: absolute;
        left: 0;
        top: 0;
        width: 800px;
      }
      .tap {
        position: absolute;
        width: 76px;
        height: 76px;
        margin: -38px 0 0 -38px;
        border-radius: 50%;
        border: 4px solid var(--ivory);
        background: rgba(245, 243, 238, 0.18);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="site"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="worlds" data-composition-id="worlds" data-composition-src="compositions/worlds.html" data-start="4" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="people" data-composition-id="people" data-composition-src="compositions/people.html" data-start="9" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="code" data-composition-id="code" data-composition-src="compositions/code.html" data-start="13" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="calm" data-composition-id="calm" data-composition-src="compositions/calm.html" data-start="17" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="more" data-composition-id="more" data-composition-src="compositions/more.html" data-start="20" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="26" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Effects, CC0 (assets/audio/rights.json); each peak lands one frame after its picture.
           snap 11; glitch 20, very low; whoosh 195 and 780; clicks on the real controls at 48
           (Reskin on) and 540 (Calm). -->
      <audio id="sfx-snap" class="clip" src="assets/audio/sfx-snap.mp3" data-start="0.376" data-duration="0.197" data-volume="0.45" data-track-index="10"></audio>
      <audio id="sfx-glitch" class="clip" src="assets/audio/sfx-glitch.mp3" data-start="0.581" data-duration="0.395" data-volume="0.12" data-track-index="11"></audio>
      <audio id="sfx-click-on" class="clip" src="assets/audio/sfx-click.mp3" data-start="1.602" data-media-start="0.35" data-duration="0.25" data-volume="0.55" data-fade-out="0.05" data-track-index="10"></audio>
      <audio id="sfx-whoosh-1" class="clip" src="assets/audio/sfx-whoosh.mp3" data-start="6.411" data-media-start="0.1" data-duration="0.4" data-volume="0.45" data-fade-out="0.067" data-track-index="11"></audio>
      <audio id="sfx-click-calm" class="clip" src="assets/audio/sfx-click.mp3" data-start="18.002" data-media-start="0.35" data-duration="0.25" data-volume="0.55" data-fade-out="0.05" data-track-index="10"></audio>
      <audio id="sfx-whoosh-2" class="clip" src="assets/audio/sfx-whoosh.mp3" data-start="25.911" data-media-start="0.1" data-duration="0.4" data-volume="0.35" data-fade-out="0.067" data-track-index="11"></audio>

      <!-- Optional bed for the sound-enabled site asset: Synthwave House Loop by Fupi, CC0 1.0, from
           frame 0 at -2.5 dB (0.75; the source is about -13.4 LUFS), fade in over frames 0-14, fade out
           over frames 840-899, for a mix near -16 LUFS. The site
           player starts muted; a silent export is made too (scripts/verify-video.mjs). -->
      <audio id="bed" class="clip" src="assets/audio/bed-synthwave-house.mp3" data-start="0" data-duration="30" data-media-start="0" data-volume="0.75" data-fade-in="0.467" data-fade-out="2" data-track-index="12"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["site"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
