name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      # The tests now include the build's, which use the pinned dev dependencies.
      - run: npm install --global npm@11.12.1
      - run: npm ci

      - run: node --test

      - name: Draw a real graph with the action
        uses: ./
        with:
          username: ${{ github.actor }}
          output: out/contributions.svg

      - run: grep -q 'contributions in the last year' out/contributions.svg

      - name: Draw a cyberpunk graph with the action
        uses: ./
        with:
          username: ${{ github.actor }}
          style: cyberpunk
          output: out/cyberpunk.svg

      - run: grep -q 'contributions in the last year' out/cyberpunk.svg && grep -q 'id="glow-4"' out/cyberpunk.svg
