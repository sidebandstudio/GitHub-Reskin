name: Pages

# Builds the showcase site and deploys it to GitHub Pages, only from main and only through the
# protected github-pages environment. Other branches and pull requests never deploy. The build
# runs check:site with --production, which fails while the site still uses its temporary
# site/dev preview adapter or development catalog.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: npm install --global npm@11.12.1

      # Dependency and browser installation are the only steps that use the network.
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium firefox

      - run: npm run check:site -- --production
      - run: npm run check:budgets -- --surface=site
      - run: npm run test:e2e -- --surface=site
      - run: npm run check:a11y -- --surface=site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
