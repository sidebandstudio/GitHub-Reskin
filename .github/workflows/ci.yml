name: Build

# Builds, checks and packages the extension and userscript. It prepares downloadable artifacts
# only; it never signs, uploads, submits or deploys anything.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: npm install --global npm@11.12.1

      # Dependency and browser installation are the only steps that use the network.
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium firefox
      - run: npm run check:toolchain

      - run: npm test
      - run: npm run check:harness
      - run: npm run build:stores
      - run: npm run lint:firefox
      - run: npm run lint:chrome
      - run: npm run package
      - run: npm run check:artifacts
      - run: npm run check:repro

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-reskin-packages
          path: |
            artifacts/
            !artifacts/e2e/
            !artifacts/reports/
          if-no-files-found: error

      # Playwright traces and screenshots, kept only when a browser test fails.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: artifacts/e2e/
          if-no-files-found: ignore
