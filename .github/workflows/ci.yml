name: Build

# Builds, checks and packages the extension and userscript, and runs the showcase site's gate. It
# prepares downloadable artifacts only; it never signs, uploads, submits or deploys anything.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: npm install --global npm@11.12.1

      # Dependency and browser installation are the only steps that use the network.
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium firefox
      - run: npm run check:toolchain

      - run: npm test
      - run: npm run check:harness
      - run: npm run build:stores
      - run: npm run lint:firefox
      - run: npm run lint:chrome
      - run: npm run package
      - run: npm run check:artifacts
      - run: npm run check:repro

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-reskin-packages
          path: |
            artifacts/
            !artifacts/e2e/
            !artifacts/reports/
          if-no-files-found: error

      # Playwright traces and screenshots, kept only when a browser test fails.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: artifacts/e2e/
          if-no-files-found: ignore

  # The same site checks the Pages workflow runs before it deploys from main, so a site failure
  # blocks a pull request instead of the deploy after the merge. The site build captures each
  # theme's first paint in Chromium; the e2e also runs Firefox, and the recovery cases launch WebKit.
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: npm install --global npm@11.12.1

      # Dependency and browser installation are the only steps that use the network. The browser
      # downloads and the package archives of their system dependencies are cached by lockfile:
      # WebKit needs about 180 packages the runner lacks, and its mirror can take over ten minutes
      # to serve them. The packages are still installed every run.
      - run: npm ci
      - run: |
          mkdir -p ~/.cache/apt-archives/partial
          echo "Dir::Cache::Archives \"$HOME/.cache/apt-archives\";" | sudo tee /etc/apt/apt.conf.d/90-cached-archives
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-archives
          key: browsers-apt-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      # apt leaves its download directory to root; the cache saves what the runner can read.
      - run: sudo rm -rf ~/.cache/apt-archives/partial ~/.cache/apt-archives/lock && sudo chown -R "$USER" ~/.cache/apt-archives

      - run: npm run check:site -- --production
      - run: npm run check:budgets -- --surface=site
      - run: npm run test:e2e -- --surface=site
      - run: npm run check:a11y -- --surface=site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: site-playwright-results
          path: artifacts/e2e/
          if-no-files-found: ignore
