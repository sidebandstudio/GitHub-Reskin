name: GitHub Reskin contribution graph
description: Draws your GitHub contribution graph as an SVG in any color.
author: Ali Tleis
branding:
  icon: grid
  color: orange

inputs:
  username:
    description: GitHub user whose contributions to draw.
    default: ${{ github.repository_owner }}
  token:
    description: Token for the GitHub GraphQL API. The workflow token works.
    default: ${{ github.token }}
  output:
    description: Where to write the SVG.
    default: contributions.svg
  style:
    description: flat, or cyberpunk for a neon panel with glowing cells.
    default: flat
  color:
    description: Color for the busiest days. Quieter days get fainter mixes of it. Leave empty for the style's colors (#f2a93b for flat).
    default: ""
  background:
    description: Panel color. Leave empty for the style's color (#0a0a0b for flat).
    default: ""
  text:
    description: Text color. Leave empty for the style's color (#ededea for flat).
    default: ""

runs:
  using: node24
  main: index.mjs
