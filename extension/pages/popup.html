<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub Reskin</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="popup.css" />
    <script src="pages.js" defer></script>
  </head>
  <body class="rs-popup" data-page="popup">
    <header class="rs-top">
      <img class="rs-mark" src="icon.svg" alt="" width="28" height="28" />
      <h1 class="rs-title">GitHub Reskin</h1>
      <label class="rs-switch rs-top-switch">
        <input type="checkbox" role="switch" data-rs="enabled" />
        <span class="rs-visually-hidden">Reskin</span>
      </label>
    </header>

    <p class="rs-error" role="alert" data-rs="error" hidden>
      <span data-rs-text></span>
      <button type="button" class="rs-link-button" data-rs="retry" hidden>Retry</button>
    </p>

    <section class="rs-notices" data-rs="notices" aria-label="Update notes" hidden>
      <ul data-rs-list></ul>
      <button type="button" class="rs-link-button" data-rs-dismiss>Dismiss</button>
    </section>

    <section class="rs-themes" aria-labelledby="rs-theme-heading">
      <h2 class="rs-heading" id="rs-theme-heading">Theme</h2>
      <div class="rs-browse">
        <div class="rs-groups" data-rs="groups" role="group" aria-label="Theme groups"></div>
        <label class="rs-visually-hidden" for="rs-search">Search themes or shows</label>
        <input id="rs-search" class="rs-search" type="search" placeholder="Search" autocomplete="off" data-rs="search" aria-describedby="rs-count" />
        <p id="rs-count" class="rs-count rs-visually-hidden" data-rs="count" aria-live="polite"></p>
      </div>
      <section class="rs-gallery" aria-label="Themes" data-rs="gallery"></section>
      <div class="rs-empty" data-rs="empty" hidden>
        <p data-rs-text></p>
        <button type="button" class="rs-link-button" data-rs-clear>Clear search</button>
      </div>
    </section>

    <section class="rs-colors" aria-labelledby="rs-colors-heading">
      <div class="rs-heading-row">
        <h2 class="rs-heading" id="rs-colors-heading">Colors</h2>
        <button type="button" class="rs-link-button" data-rc="reset">Reset to theme</button>
      </div>
      <div class="rs-color-grid" data-rc="rows"></div>
      <p class="rs-note" role="status" aria-live="polite" data-rc="note"></p>
    </section>

    <section class="rs-prefs" aria-label="Appearance">
      <fieldset class="rs-segmented" data-rs="appearance" aria-describedby="rs-appearance-note">
        <legend class="rs-heading">Appearance</legend>
        <span class="rs-segments">
          <label><input type="radio" name="appearance" value="full" />Full</label>
          <label><input type="radio" name="appearance" value="calm" />Calm</label>
        </span>
      </fieldset>
      <p class="rs-note" id="rs-appearance-note">Full adds backgrounds and extras. Calm keeps colors and fonts.</p>
      <label class="rs-switch rs-pref"><input type="checkbox" role="switch" data-rs="text" aria-describedby="rs-text-note" />Extra theme text</label>
      <p class="rs-note rs-visually-hidden" id="rs-text-note">Adds labels like // choom. Your own words stay the same.</p>
      <label class="rs-switch rs-pref"><input type="checkbox" role="switch" data-rs="motion" aria-describedby="rs-motion-note" />Motion</label>
      <p class="rs-note" id="rs-motion-note" data-rs="motion-note" hidden>Paused by your device's reduced-motion setting</p>
    </section>

    <div class="rs-state">
      <p class="rs-note rs-summary-note" data-rs="summary-note"></p>
      <p class="rs-status" role="status" aria-live="polite" data-rs="status"></p>
      <button type="button" class="rs-link-button" data-rs="undo" aria-label="Undo theme change" hidden>Undo</button>
    </div>

    <footer class="rs-popup-footer">
      <span class="rs-footer-name"><span data-rs="summary-show"></span> <span class="rs-visually-hidden" data-rs="summary-name"></span></span>
      <span class="rs-footer-links">
        <button type="button" class="rs-link-button" data-rs-open="settings">Settings</button>
        <a href="https://github.com/sidebandstudio/GitHub-Reskin" target="_blank" rel="noopener noreferrer">Themes and source</a>
      </span>
    </footer>
  </body>
</html>
